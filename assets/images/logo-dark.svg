<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" class="stayora-logo-dark-svg">
  <defs>
    <linearGradient id="stayoraBlueGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Stayora Geometric Architectural Icon (House + 'S' Monogram) -->
  <g transform="translate(6, 6)">
    <!-- House Left Wall & Foundation (Blue) -->
    <path d="M 12 30 L 12 56 L 24 56 L 24 44" 
          stroke="url(#stayoraBlueGradLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Chimney (Blue) -->
    <path d="M 17 22 L 17 14 L 21 14 L 21 18" 
          stroke="url(#stayoraBlueGradLight)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Slanted Roofline (Blue) -->
    <path d="M 6 36 L 26 24 L 40 14 L 42 16" 
          stroke="url(#stayoraBlueGradLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pure White Outer House Gable & Right Frame -->
    <path d="M 40 19 L 58 32 L 58 56 L 32 56 L 32 40" 
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Inner S-Bar Cross (Blue) -->
    <path d="M 22 34 L 52 50" 
          stroke="url(#stayoraBlueGradLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top White Intersecting S Hook -->
    <path d="M 28 29 L 50 40" 
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: 'Stayora' -->
  <text x="76" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px" fill="#FFFFFF">
    Stay<tspan fill="url(#stayoraBlueGradLight)">ora</tspan>
  </text>

  <!-- Tagline: 'LUXURY STAYS & VILLAS' -->
  <text x="77" y="58" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2px" fill="#94A3B8">
    LUXURY STAYS &amp; VILLAS
  </text>
</svg>
