<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" class="stayora-emblem-svg">
  <defs>
    <linearGradient id="stayoraIconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <g transform="translate(6, 6)">
    <!-- House Left Wall & Foundation (Blue) -->
    <path d="M 12 30 L 12 56 L 24 56 L 24 44" 
          stroke="url(#stayoraIconBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Chimney (Blue) -->
    <path d="M 17 22 L 17 14 L 21 14 L 21 18" 
          stroke="url(#stayoraIconBlue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Slanted Roofline (Blue) -->
    <path d="M 6 36 L 26 24 L 40 14 L 42 16" 
          stroke="url(#stayoraIconBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dark Navy Outer House Gable & Right Frame -->
    <path d="M 40 19 L 58 32 L 58 56 L 32 56 L 32 40" 
          stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Inner S-Bar Cross (Blue) -->
    <path d="M 22 34 L 52 50" 
          stroke="url(#stayoraIconBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top Navy Intersecting S Hook -->
    <path d="M 28 29 L 50 40" 
          stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
